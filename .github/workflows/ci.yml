name: EduFlow checks

on:
  pull_request:
    branches:
      - main
      - team-a
      - team-b
      - team-c
  push:
    branches:
      - main
      - team-a
      - team-b
      - team-c

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Install Korean font for PDF export
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
